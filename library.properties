sentence=Native ESP32 Allen-Bradley ControlLogix EtherNet/IP and CIP client.
paragraph=Native, fully non-blocking EtherNet/IP and CIP client for the ESP32 that reads and writes symbolic tags on Allen-Bradley/Rockwell ControlLogix and compatible Logix controllers. Implements EtherNet/IP encapsulation (RegisterSession, SendRRData, SendUnitData), CIP explicit and connected messaging, and typed symbolic tag access for BOOL, SINT, INT, DINT, LINT, REAL, LREAL, and STRING, with callbacks, reconnect, and PLC-restart recovery.
